name: build

on:
  push:
    branches:
      - gh-pages
  pull_request:
    types: [ opened, labeled, unlabeled, synchronize ]
  # Manual run from the Actions tab. The checks run first here too, and the
  # deploy job's own condition still applies.
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs for the same PR/branch (saves runner minutes on rapid pushes, e.g.
# Renovate, and gives faster feedback on the latest commit); let master runs finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/gh-pages' }}

env:
  JAVA_VERSION: 25
  NODE_VERSION: 24

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Configure JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Configure Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Nu HTML Checker
        run: npm install --no-save vnu-jar

      - name: Validate HTML
        run: java -jar node_modules/vnu-jar/build/dist/vnu.jar index.html 404.html privacy.html

      - name: Check JavaScript syntax
        run: for f in static/js/*.js workers/contact/*.js; do node --check "$f"; done

      - name: Run tests
        run: node --test "tests/*.test.ts" "workers/agent-readiness/*.test.ts"

      # No credentials: proves the config, the bundle, and the asset upload
      # list are valid without showing the Cloudflare token to a pull request.
      - name: Validate Cloudflare config (dry run)
        run: npx --yes wrangler@4.166.0 deploy --dry-run

  # In this workflow, not its own, so that `needs` can hold it back until the
  # checks pass.
  deploy:
    name: Deploy to Cloudflare
    needs: checks
    # Never from a pull request, and only from gh-pages.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/gh-pages'
    # The token is a secret of this environment, which only gh-pages may use,
    # so a workflow edited on another branch cannot read it.
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Deploys queue instead of racing, and a running upload is never canceled.
    concurrency:
      group: cloudflare-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout Project
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Pinned by commit SHA: the only third-party action, and the only step that receives the token.
      - name: Deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # The same wrangler as the dry run; tests/workflow.test.ts keeps them equal.
          wranglerVersion: "4.166.0"
          command: deploy
